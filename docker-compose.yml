services:
  db:
    image: postgres:15-alpine
    container_name: nexus_db
    restart: always
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus_password
      - POSTGRES_DB=nexus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: nexus_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexus.ai
      PGADMIN_DEFAULT_PASSWORD: nexus_password
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
