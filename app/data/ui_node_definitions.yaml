  inputs:
  - id: input
    label: Input
    type: any
  outputs:
  - id: output
    label: Output
    type: any
  color: '#4f46e5'
  defaultProperties:
    group_name: ''
  propertyDefinitions:
  - name: group_name
    label: Group Name
    type: text
  tags:
  - history
  - undo
  - batch
- type: advanced.backend.save_workflow
  label: Save Workflow
  category: Advanced/Backend
  version: 1.0.0
  description: Saves the current workflow to the backend storage. Creates or updates
