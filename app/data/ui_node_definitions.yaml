  inputs:
  - id: state
    label: State
    type: any
  outputs:
  - id: checkpoint_id
    label: Checkpoint ID
    type: string
  color: '#818cf8'
  defaultProperties:
    checkpoint_name: ''
    auto_named: true
  propertyDefinitions:
  - name: checkpoint_name
    label: Name
    type: text
  - name: auto_named
    label: Auto-named
    type: boolean
  tags:
  - history
  - checkpoint
  - save
- type: advanced.history.restore
  label: Restore
  category: Advanced/History
  version: 1.0.0
  description: Restores workflow state from a previously saved checkpoint.
  inputs:
  - id: checkpoint_id
    label: Checkpoint ID
    type: string
  outputs:
  - id: state
    label: State
    type: any
  color: '#6366f1'
  defaultProperties: {}
  propertyDefinitions: []
  tags:
  - history
  - restore
  - rollback
- type: advanced.history.undo_group
  label: Undo Group
  category: Advanced/History
  version: 1.0.0
  description: Groups multiple node changes into a single undoable action. Batches
