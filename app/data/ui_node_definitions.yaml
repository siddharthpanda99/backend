advanced:
- type: advanced.group
  label: Node Group
  category: Advanced/Layout
  version: 1.2.0
  description: A structural container used to encapsulate and visually organize a
    set of related nodes. Does not affect execution logic but significantly improves
    workspace clarity for complex graphs.
  inputs: []
  outputs: []
  color: '#94a3b8'
  defaultProperties:
    title: My Group
    description: ''
    show_border: true
    padding: 20
  propertyDefinitions:
  - name: title
    label: Group Title
    type: text
  - name: description
    label: Description
    type: textarea
  - name: show_border
    label: Show Border
    type: boolean
  - name: padding
    label: Internal Padding
    type: number
  tags:
  - layout
  - group
  - container
- type: advanced.frame
  label: Canvas Frame
  category: Advanced/Layout
  version: 1.0.0
  description: Large boundary frame used to isolate regional logic on the canvas.
    Supports custom labels and border styles for documentation and architectural highlighting.
  inputs: []
  outputs: []
  color: '#64748b'
  defaultProperties:
    title: New Section
    font_size: 18
    border_style: dashed
  propertyDefinitions:
  - name: title
    label: Frame Title
    type: text
  - name: font_size
    label: Font Size
    type: number
  - name: border_style
    label: Border Style
    type: select
    options:
    - solid
    - dashed
    - dotted
  tags:
  - layout
  - frame
  - visual
- type: advanced.subflow
  label: Subflow
  category: Advanced/Execution
  version: 2.1.0
  description: References and executes another workflow as a modular component. Enables
    hierarchical design and logic reuse across multiple projects. Supports asynchronous
    completion wait.
  inputs:
  - id: input
    label: Payload
    type: any
  outputs:
  - id: output
    label: Result
    type: any
  color: '#3b82f6'
  defaultProperties:
    workflow_id: ''
    wait_for_completion: true
  propertyDefinitions:
  - name: workflow_id
    label: Target Workflow
    type: text
  - name: wait_for_completion
    label: Wait for Completion
    type: boolean
  tags:
  - execution
  - subflow
  - nested
- type: advanced.macro
  label: Macro Node
  category: Advanced/Execution
  version: 1.0.0
  description: Injects a predefined subgraph template into the current execution path.
    Unlike Subflows, Macros are expanded inline and maintain shared state with the
    parent graph.
  inputs:
  - id: in
    label: In
    type: any
  outputs:
  - id: out
    label: Out
    type: any
  color: '#10b981'
  tags:
  - execution
  - macro
  - inline
- type: core.util.annotation
  label: Annotation
  category: Advanced/Documentation
  version: 1.0.0
  description: Large-format text overlay for high-level technical documentation directly
    on the canvas. Ideal for section headers and architectural summaries.
  inputs: []
  outputs: []
  defaultProperties:
    text: SECTION TITLE
    font_size: 24
    bold: true
    opacity: 0.8
  propertyDefinitions:
  - name: text
    label: Text
    type: text
  - name: font_size
    label: Font Size
    type: number
    min: 8
    max: 120
  - name: bold
    label: Bold
    type: boolean
  - name: opacity
    label: Opacity
    type: number
    min: 0
    max: 1
    step: 0.1
  tags:
  - documentation
  - label
  - text
  color: '#fcd34d'
- type: core.util.note
  label: Sticky Note
  category: Advanced/Documentation
  version: 1.1.0
  description: Digital post-it note for developer-level annotations, TODOs, and implementation
    caveats. Supports multi-line rich text content.
  inputs: []
  outputs: []
  defaultProperties:
    content: Write your note here...
  propertyDefinitions:
  - name: content
    label: Content
    type: textarea
  tags:
  - comment
  - documentation
  color: '#fef08a'
- type: advanced.media.image_preview
  label: Image Preview
  category: Advanced/Media
  version: 1.5.0
  description: Interactive visualization node for pixel-based media. Provides real-time
    rendering of image processing pipelines with support for metadata inspection and
    zoom control.
  inputs:
  - id: image
    label: IMAGE
    type: image
    required: true
  outputs:
  - id: image
    label: IMAGE
    type: image
  color: '#06b6d4'
  defaultProperties:
    preview: ''
    zoom: 1
    show_metadata: true
  propertyDefinitions:
  - name: preview
    label: Preview Viewport
    type: image_preview
  - name: zoom
    label: Preview Zoom
    type: number
    min: 0.1
    max: 2
    step: 0.1
  - name: show_metadata
    label: Show Metadata
    type: boolean
  tags:
  - preview
  - image
  - output
- type: advanced.media.file_upload
  label: File Upload
  category: Advanced/Media
  version: 1.0.0
  description: Upload and manage file inputs for workflow execution. Supports various
    file types including images, text, JSON, and binary data with validation and type
    detection.
  inputs: []
  outputs:
  - id: file
    label: File Data
    type: any
  - id: path
    label: File Path
    type: string
  - id: type
    label: File Type
    type: string
  - id: size
    label: File Size
    type: number
  color: '#8b5cf6'
  defaultProperties:
    file_type: any
    max_size_mb: 50
    multiple: false
    allowed_extensions: ''
  propertyDefinitions:
  - name: file_type
    label: File Type
    type: select
    options:
    - any
    - image
    - text
    - json
    - audio
    - video
    - binary
  - name: max_size_mb
    label: Max Size (MB)
    type: number
    min: 1
    max: 500
  - name: multiple
    label: Allow Multiple
    type: boolean
  - name: allowed_extensions
    label: Allowed Extensions
    type: text
    description: Comma-separated list (e.g., png,jpg,jpeg)
  tags:
  - upload
  - file
  - input
- type: advanced.transform.map
  label: Map Transform
  category: Advanced/Transform
  version: 1.0.0
  description: Applies a transformation function to each item in an array or collection.
    Enables batch processing and data mapping operations.
  inputs:
  - id: data
    label: Input Data
    type: any
    required: true
  outputs:
  - id: result
    label: Transformed
    type: any
  color: '#ec4899'
  defaultProperties:
    transform_expression: item => item
    output_key: mapped
  propertyDefinitions:
  - name: transform_expression
    label: Transform Expression
    type: code
    description: JavaScript expression using "item" variable
  - name: output_key
    label: Output Key
    type: text
  tags:
  - transform
  - map
  - array
- type: advanced.transform.filter
  label: Filter Transform
  category: Advanced/Transform
  version: 1.0.0
  description: Filters input data based on a condition expression. Keeps only elements
    that match the criteria.
  inputs:
  - id: data
    label: Input Data
    type: any
    required: true
  outputs:
  - id: result
    label: Filtered
    type: any
  color: '#f97316'
  defaultProperties:
    condition: item => true
    output_key: filtered
  propertyDefinitions:
  - name: condition
    label: Filter Condition
    type: code
    description: JavaScript expression returning boolean
  - name: output_key
    label: Output Key
    type: text
  tags:
  - transform
  - filter
  - condition
- type: advanced.transform.merge
  label: Merge Data
  category: Advanced/Transform
  version: 1.0.0
  description: Combines multiple data inputs into a single output object or array.
    Supports deep merging and concatenation modes.
  inputs:
  - id: input1
    label: Input 1
    type: any
  - id: input2
    label: Input 2
    type: any
  outputs:
  - id: result
    label: Merged
    type: any
  color: '#14b8a6'
  defaultProperties:
    merge_mode: object
    output_key: merged
  propertyDefinitions:
  - name: merge_mode
    label: Merge Mode
    type: select
    options:
    - object
    - array_concat
    - array_merge
    - deep_merge
  - name: output_key
    label: Output Key
    type: text
  tags:
  - transform
  - merge
  - combine
- type: advanced.flow.if
  label: If Condition
  category: Advanced/Flow
  version: 1.0.0
  description: Conditional branching node that evaluates a condition and routes execution
    to either the true or false output.
  inputs:
  - id: condition
    label: Condition
    type: any
    required: true
  outputs:
  - id: 'true'
    label: 'True'
    type: any
  - id: 'false'
    label: 'False'
    type: any
  color: '#22c55e'
  defaultProperties:
    expression: value === true
    output_key: branch
  propertyDefinitions:
  - name: expression
    label: Condition Expression
    type: code
    description: JavaScript expression evaluated against input
  - name: output_key
    label: Output Key
    type: text
  tags:
  - flow
  - conditional
  - branch
- type: advanced.flow.switch
  label: Switch
  category: Advanced/Flow
  version: 1.0.0
  description: Multi-way branching based on matched case values. Routes input to the
    first matching case output.
  inputs:
  - id: value
    label: Value
    type: any
    required: true
  outputs:
  - id: case1
    label: Case 1
    type: any
  - id: case2
    label: Case 2
    type: any
  - id: default
    label: Default
    type: any
  color: '#84cc16'
  defaultProperties:
    cases: case1,case2
    match_mode: equals
  propertyDefinitions:
  - name: cases
    label: Case Values
    type: text
    description: Comma-separated case values
  - name: match_mode
    label: Match Mode
    type: select
    options:
    - equals
    - contains
    - regex
    - startsWith
  tags:
  - flow
  - switch
  - branch
- type: advanced.flow.for_each
  label: For Each
  category: Advanced/Flow
  version: 1.0.0
  description: Iterates over each item in a collection and executes the connected
    subgraph. Collects results into an output array.
  inputs:
  - id: collection
    label: Collection
    type: any
    required: true
  outputs:
  - id: item
    label: Current Item
    type: any
  - id: index
    label: Index
    type: number
  - id: result
    label: Results
    type: any
  color: '#a855f7'
  defaultProperties:
    max_iterations: 100
    parallel: false
  propertyDefinitions:
  - name: max_iterations
    label: Max Iterations
    type: number
    min: 1
    max: 10000
  - name: parallel
    label: Parallel Execution
    type: boolean
    description: Process items concurrently
  tags:
  - flow
  - loop
  - iteration
- type: advanced.flow.while
  label: While Loop
  category: Advanced/Flow
  version: 1.0.0
  description: Repeatedly executes a subgraph while a condition evaluates to true.
    Supports early exit via break condition.
  inputs:
  - id: initial
    label: Initial Value
    type: any
  outputs:
  - id: output
    label: Output
    type: any
  - id: iteration
    label: Iteration Count
    type: number
  color: '#d946ef'
  defaultProperties:
    condition: value < 10
    max_iterations: 100
    break_on: ''
  propertyDefinitions:
  - name: condition
    label: Loop Condition
    type: code
    description: JavaScript expression evaluated each iteration
  - name: max_iterations
    label: Max Iterations
    type: number
    min: 1
    max: 10000
  - name: break_on
    label: Break Condition
    type: text
    description: Optional break condition expression
  tags:
  - flow
  - loop
  - while
- type: advanced.flow.retry
  label: Retry Handler
  category: Advanced/Flow
  version: 1.0.0
  description: Wraps execution with automatic retry logic. Retries on failure up to
    the specified count with optional delay.
  inputs:
  - id: input
    label: Input
    type: any
    required: true
  outputs:
  - id: output
    label: Output
    type: any
  - id: error
    label: Error
    type: any
  color: '#ef4444'
  defaultProperties:
    max_attempts: 3
    delay_ms: 1000
    backoff_multiplier: 2
    retry_on_errors: Error,Exception
  propertyDefinitions:
  - name: max_attempts
    label: Max Attempts
    type: number
    min: 1
    max: 10
  - name: delay_ms
    label: Initial Delay (ms)
    type: number
    min: 0
    max: 60000
  - name: backoff_multiplier
    label: Backoff Multiplier
    type: number
    min: 1
    max: 5
  - name: retry_on_errors
    label: Retry On Errors
    type: text
    description: Comma-separated error types to retry
  tags:
  - flow
  - retry
  - error
- type: advanced.flow.fallback
  label: Fallback
  category: Advanced/Flow
  version: 1.0.0
  description: Provides a fallback value if the primary input fails or is empty. Enables
    graceful degradation.
  inputs:
  - id: primary
    label: Primary
    type: any
  - id: fallback
    label: Fallback
    type: any
  outputs:
  - id: result
    label: Result
    type: any
  color: '#64748b'
  defaultProperties:
    check_empty: true
    empty_values: null,undefined,""
  propertyDefinitions:
  - name: check_empty
    label: Check for Empty
    type: boolean
  - name: empty_values
    label: Empty Values
    type: text
    description: Comma-separated values considered empty
  tags:
  - flow
  - fallback
  - default
- type: advanced.flow.circuit_breaker
  label: Circuit Breaker
  category: Advanced/Flow
  version: 1.0.0
  description: Prevents cascading failures by temporarily blocking execution after
    repeated errors. Resets after recovery timeout.
  inputs:
  - id: input
    label: Input
    type: any
    required: true
  outputs:
  - id: output
    label: Output
    type: any
  - id: state
    label: State
    type: string
  color: '#f59e0b'
  defaultProperties:
    failure_threshold: 5
    recovery_timeout_ms: 30000
    half_open_max_calls: 1
  propertyDefinitions:
  - name: failure_threshold
    label: Failure Threshold
    type: number
    min: 1
    max: 100
    description: Failures before opening circuit
  - name: recovery_timeout_ms
    label: Recovery Timeout (ms)
    type: number
    min: 1000
    max: 300000
  - name: half_open_max_calls
    label: Half-Open Max Calls
    type: number
    min: 1
    max: 10
  tags:
  - flow
  - circuit_breaker
  - resilience
- type: advanced.compensation.compensate
  label: Compensate
  category: Advanced/Compensation
  version: 1.0.0
  description: Executes compensation logic to undo or rollback changes when a failure
    occurs in a saga pattern. Supports nested compensation chains.
  inputs:
  - id: context
    label: Context
    type: any
  outputs:
  - id: result
    label: Result
    type: any
  - id: compensated
    label: Compensated
    type: boolean
  color: '#dc2626'
  defaultProperties:
    compensation_strategy: rollback
    timeout_ms: 30000
  propertyDefinitions:
  - name: compensation_strategy
    label: Strategy
    type: select
    options:
    - rollback
    - inverse
    - custom
    - noop
  - name: timeout_ms
    label: Timeout (ms)
    type: number
    min: 1000
    max: 120000
  tags:
  - compensation
  - saga
  - rollback
- type: advanced.compensation.saga
  label: Saga Orchestrator
  category: Advanced/Compensation
  version: 1.0.0
  description: Orchestrates a sequence of transactions with automatic compensation
    on failure. Implements the saga pattern for distributed workflows.
  inputs:
  - id: input
    label: Input
    type: any
  outputs:
  - id: output
    label: Output
    type: any
  - id: error
    label: Error
    type: any
  color: '#b91c1c'
  defaultProperties:
    steps: ''
    stop_on_failure: true
  propertyDefinitions:
  - name: steps
    label: Steps
    type: textarea
    description: JSON array of saga steps
  - name: stop_on_failure
    label: Stop on Failure
    type: boolean
  tags:
  - compensation
  - saga
  - orchestrator
- type: advanced.test.mock_input
  label: Mock Input
  category: Advanced/Testing
  version: 1.0.0
  description: Provides mock data for workflow testing. Supports static values, random
    data, and parameterized inputs.
  inputs: []
  outputs:
  - id: output
    label: Mock Data
    type: any
  color: '#0ea5e9'
  defaultProperties:
    mock_data: '{}'
    random_seed: 12345
    mock_mode: static
  propertyDefinitions:
  - name: mock_data
    label: Mock Data
    type: textarea
    description: JSON or template for mock data
  - name: random_seed
    label: Random Seed
    type: number
  - name: mock_mode
    label: Mode
    type: select
    options:
    - static
    - random
    - sequence
    - faker
  tags:
  - testing
  - mock
  - simulation
- type: advanced.test.assert
  label: Assert
  category: Advanced/Testing
  version: 1.0.0
  description: Validates workflow outputs against expected conditions. Fails the workflow
    if assertions do not pass.
  inputs:
  - id: actual
    label: Actual
    type: any
    required: true
  outputs:
  - id: passed
    label: Passed
    type: boolean
  - id: message
    label: Message
    type: string
  color: '#22d3ee'
  defaultProperties:
    expected: ''
    assertion_type: equals
  propertyDefinitions:
  - name: expected
    label: Expected
    type: textarea
    description: Expected value or expression
  - name: assertion_type
    label: Assertion Type
    type: select
    options:
    - equals
    - contains
    - greaterThan
    - lessThan
    - matches
    - truthy
    - falsy
  tags:
  - testing
  - assert
  - validation
- type: advanced.test.breakpoint
  label: Breakpoint
  category: Advanced/Testing
  version: 1.0.0
  description: Pauses workflow execution at this point for debugging. Allows inspection
    of intermediate state.
  inputs:
  - id: input
    label: Input
    type: any
  outputs:
  - id: output
    label: Output
    type: any
  color: '#f472b6'
  defaultProperties:
    stop_condition: ''
    log_state: true
  propertyDefinitions:
  - name: stop_condition
    label: Stop Condition
    type: text
    description: Optional condition to stop
  - name: log_state
    label: Log State
    type: boolean
  tags:
  - testing
  - breakpoint
  - debug
- type: advanced.test.tap
  label: Tap (Debug)
  category: Advanced/Testing
  version: 1.0.0
  description: Intercepts data flow without modifying it. Useful for logging and debugging.
  inputs:
  - id: input
    label: Input
    type: any
    required: true
  outputs:
  - id: output
    label: Output
    type: any
  color: '#c084fc'
  defaultProperties:
    log_to_console: true
    label: tap
  propertyDefinitions:
  - name: log_to_console
    label: Log to Console
    type: boolean
  - name: label
    label: Label
    type: text
  tags:
  - testing
  - tap
  - debug
- type: advanced.history.checkpoint
  label: Checkpoint
  category: Advanced/History
  version: 1.0.0
  description: Saves a recoverable checkpoint of the workflow state. Enables rollback
