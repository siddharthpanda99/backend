    label: Method
    type: select
    options:
    - GET
    - POST
    - PUT
    - PATCH
  - name: headers
    label: Headers
    type: textarea
  tags:
  - backend
  - webhook
  - http
- type: advanced.collab.lock
  label: Lock Node
  category: Advanced/Collaboration
  version: 1.0.0
  description: Locks a node for exclusive editing by the current user. Prevents concurrent
    modifications.
  inputs:
  - id: node_id
    label: Node ID
    type: string
  outputs:
  - id: locked
    label: Locked
    type: boolean
  color: '#f59e0b'
  defaultProperties:
    lock_timeout_ms: 300000
  propertyDefinitions:
  - name: lock_timeout_ms
    label: Lock Timeout (ms)
    type: number
    min: 60000
    max: 3600000
  tags:
  - collab
  - lock
  - concurrent
- type: advanced.collab.comment
  label: Comment
  category: Advanced/Collaboration
  version: 1.0.0
  description: Adds a comment thread to a node or canvas area for team discussion.
  inputs: []
