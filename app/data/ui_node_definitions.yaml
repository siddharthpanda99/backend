  color: '#059669'
  defaultProperties:
    workflow_name: ''
    version: 1.0.0
    is_public: false
  propertyDefinitions:
  - name: workflow_name
    label: Name
    type: text
  - name: version
    label: Version
    type: text
  - name: is_public
    label: Public
    type: boolean
  tags:
  - backend
  - save
  - storage
- type: advanced.backend.load_workflow
  label: Load Workflow
  category: Advanced/Backend
  version: 1.0.0
  description: Loads a workflow definition from the backend storage.
  inputs:
  - id: workflow_id
    label: Workflow ID
    type: string
  outputs:
  - id: workflow
    label: Workflow
    type: any
  color: '#047857'
  defaultProperties: {}
  propertyDefinitions: []
  tags:
  - backend
  - load
  - storage
- type: advanced.backend.run_workflow
  label: Run Workflow
  category: Advanced/Backend
  version: 1.0.0
  description: Executes a named workflow from the backend and returns the result.
  inputs:
  - id: workflow_id
    label: Workflow ID
    type: string
  - id: inputs
    label: Inputs
    type: any
  outputs:
  - id: result
    label: Result
    type: any
  - id: execution_id
    label: Execution ID
    type: string
  color: '#065f46'
  defaultProperties:
    wait_for_completion: true
    timeout_ms: 60000
  propertyDefinitions:
  - name: wait_for_completion
    label: Wait
    type: boolean
  - name: timeout_ms
    label: Timeout (ms)
    type: number
    min: 1000
    max: 300000
  tags:
  - backend
  - execute
  - run
- type: advanced.backend.webhook
  label: Webhook
  category: Advanced/Backend
  version: 1.0.0
  description: Triggers an external webhook URL with workflow data.
  inputs:
  - id: payload
    label: Payload
    type: any
  outputs:
  - id: response
    label: Response
    type: any
  - id: status
    label: Status
    type: number
  color: '#064e3b'
  defaultProperties:
    url: ''
    method: POST
    headers: '{}'
