[project]
name = "backend"
version = "0.1.0"
description = "Nexus AI Platform Backend"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "python-json-logger>=2.0.0",
    "croniter>=2.0.0",
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0.2",
    "psycopg[binary]>=3.2.1",
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=25.1.0",
    "common_lib",
    "langchain>=0.3.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "cachetools>=5.0.0",
    "xformers>=0.0.29.post3",
    "tomesd>=0.1.3",
    "google-genai>=0.1.0",
    "mcp>=1.0.0",
    "pdfplumber>=0.11.9",
    "pdf2image>=1.17.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "liteparse",
    "docling",
    "transformers>=4.48.0",
    "jmespath>=1.1.0",
    "presidio-anonymizer>=2.2.363",
    "presidio-analyzer>=2.2.362",
    "boto3>=1.43.48",
    "pytesseract>=0.3.13",
    "psycopg2-binary>=2.9.12",
    "soundfile>=0.14.0",
    "audioread>=3.1.0",
    "opencv-contrib-python>=5.0.0,<6.0.0",
    "midiutil>=1.2.1",
    "pydub>=0.25.1",
    "python-rtmidi>=1.5.8",
    "ffmpeg-python>=0.2.0",
    "librosa>=0.11.0",
    "litellm>=1.92.0",
    "duckduckgo-search",
    "trafilatura",
]


[tool.pytest.ini_options]
markers = [
    "integration: Integration tests that require external services or models",
]

[project.scripts]
nexus = "app.cli:main"
dev = "app.cli:dev_server"
db-up = "app.cli:db_up"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
common_lib = { path = "../Python Libs/common_lib", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25",
    "requests>=2.32.5",
]
