[project]
name = "backend"
version = "0.1.0"
description = "Nexus AI Platform Backend"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "python-json-logger>=2.0.0",
    "croniter>=2.0.0",
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0.2",
    "psycopg[binary]>=3.2.1",
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=25.1.0",
    "common_lib",
    "langchain>=0.3.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "cachetools>=5.0.0",
    "xformers>=0.0.29.post3",
    "tomesd>=0.1.3",
    "google-genai>=0.1.0",
    "mcp>=1.0.0",
    "pdfplumber>=0.11.9",
    "pdf2image>=1.17.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "liteparse",
    "docling",
    "transformers>=4.48.0",
    "jmespath>=1.1.0",
    "presidio-anonymizer>=2.2.363",
    "presidio-analyzer>=2.2.362",
    "boto3>=1.43.48",
    "pytesseract>=0.3.13",
    "psycopg2-binary>=2.9.12",
    "soundfile>=0.14.0",
    "audioread>=3.1.0",
    "opencv-contrib-python>=5.0.0,<6.0.0",
    "midiutil>=1.2.1",
    "pydub>=0.25.1",
    "python-rtmidi>=1.5.8",
    "ffmpeg-python>=0.2.0",
    "librosa>=0.11.0",
    "litellm>=1.92.0",
    "duckduckgo-search",
    "trafilatura",
    "sentence-transformers>=2.2.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: Integration tests that require external services or models",
]

# `ijson` is required by the declared `sync-prompts` console script but was
# declared NOWHERE in the repo -- the only occurrences were comments. Because
# `app/cli/sync_prompts.py` imported it at module scope, the whole module was
# unimportable, so the console script could not run at all.
#
# It is an EXTRA, not a hard dependency, for two reasons:
#   1. `ijson` ships a C extension; adding it to the default install would
#      change resolution for every platform install, and this repo's `uv`
#      resolution is already broken (torch/moondream), so a hard dep could not
#      be verified here.
#   2. Exactly one module consumes it. Nothing else in the repo imports ijson,
#      so paying for it on every install buys nothing.
# With the extra absent, `sync-prompts` now raises MissingSyncPromptsDependency
# naming the package and the install command, instead of a bare ModuleNotFoundError.
[project.optional-dependencies]
prompts-sync = ["ijson>=3.2"]

[project.scripts]
# Repointed 2026-10-03 (CLI retirement). `app.cli:main` was BROKEN before this
# change: `app/cli.py` (a module) is shadowed by the `app/cli/` package, so
# `app.cli` resolved to the empty `app/cli/__init__.py` and every `app.cli:*`
# attribute below raised AttributeError. Verified empirically:
#   >>> import app.cli; app.cli.__file__
#   .../Backend/app/cli/__init__.py
#   >>> app.cli.main        -> MISSING ATTR main
# `nexus` now launches the canonical CLI (same target as the `cli` script in
# common_lib/pyproject.toml) and matches setup.py, which also no longer
# disagreed with this file.
nexus = "common_lib.modules.cli.runtime.runner:main"
# FIXED (declared-but-dead lane). These still target `app/cli.py` — the uvicorn
# launcher for `app.main:app` and the docker-compose wrappers — because rule 07
# forbids common_lib from hosting a FastAPI launcher, so they cannot be
# repointed into common_lib.modules.cli. They were unreachable because the
# `app/cli/` PACKAGE shadows the `app/cli.py` module: FileFinder tries the
# directory `cli` before the file `cli.py`, so `import app.cli` bound the
# package and `dev_server` / `db_up` raised AttributeError.
# `app/cli/__init__.py` now loads `app/cli.py` by path and re-exports its
# callables. Nothing was deleted from app/cli.py.
dev = "app.cli:dev_server"
db-up = "app.cli:db_up"
node-server = "app.mcp.standalone_node_server:main"
# FIXED: `platform_mcp.agent_mesh` did not exist (never tracked in git), so
# server.py's module-scope import made this script dead. `agent_mesh.py` is
# implemented against the spec in AGENT_MESH_README.md and the persisted
# AGENT_MANIFEST.json (92 agents).
platform-mcp = "common_lib.modules.platform_mcp.server:main"
# FIXED: `app/cli/sync_prompts.py` imported `ijson` at module scope and `ijson`
# was declared nowhere in the repo, so the module was unimportable and this
# script could never run. `ijson` is now declared under the `prompts-sync`
# extra above, and the import is lazy with a named MissingSyncPromptsDependency
# naming the package and install command. The capability still has no canonical
# equivalent elsewhere: it syncs Manicode chat transcripts into
# resources/prompts.db.
sync-prompts = "app.cli.sync_prompts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
common_lib = { path = "../Python Libs/common_lib", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25",
    "requests>=2.32.5",
]
