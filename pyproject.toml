[project]
name = "backend"
version = "0.1.0"
description = "Nexus AI Platform Backend"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0.2",
    "psycopg[binary]>=3.2.1",
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=25.1.0",
    "common_lib",
    "langchain>=0.3.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "cachetools>=5.0.0",
    "xformers>=0.0.29.post3",
    "tomesd>=0.1.3",
    "google-genai>=0.1.0",
    "mcp>=1.0.0",
]


[project.scripts]
nexus = "app.cli:main"
dev = "app.cli:dev_server"
db-up = "app.cli:db_up"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
common_lib = { path = "../Python Libs/common_lib", editable = true }
